<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EWEy — The Participation Layer for All IP</title>
<style>
  :root{
    --ink:#0B1220; --canvas:#FAFAF8; --card:#FFFFFF; --gold:#C6A02E; --goldsoft:#F4EAC9;
    --muted:#7C8496; --line:rgba(11,18,32,.08); --dark:#060A14;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--canvas); color:var(--ink); overflow:hidden; overscroll-behavior:none;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #stage{position:fixed; inset:0; overflow:hidden;}
  .scene{position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;}
  .scene::-webkit-scrollbar{width:0;}
  .wrap{max-width:860px; margin:0 auto; padding:96px 24px 90px; text-align:center;}
  .wrap.wide{max-width:900px;}

  /* Type */
  .eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; color:var(--muted); margin-bottom:16px;}
  .eyebrow.gold{color:var(--gold);}
  h1{font-size:clamp(30px,6vw,52px); font-weight:700; letter-spacing:-.03em; line-height:1.08;}
  h1.md{font-size:clamp(28px,5.4vw,44px);}
  .sub{font-size:clamp(15px,2.2vw,18px); line-height:1.55; color:var(--muted); max-width:560px; margin:16px auto 0;}

  /* Buttons */
  .btn{
    font:inherit; font-size:16px; font-weight:600; letter-spacing:-.01em; padding:14px 32px;
    border-radius:999px; border:1px solid transparent; background:var(--ink); color:#fff; cursor:pointer;
    box-shadow:0 2px 10px rgba(11,18,32,.08); transition:all .25s cubic-bezier(.2,.8,.2,1);
  }
  .btn:hover{transform:scale(1.035); box-shadow:0 10px 30px rgba(11,18,32,.18);}
  .btn:active{transform:scale(.98);}
  .btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .btn.white{background:#fff; color:var(--ink);}
  .btn.gold{background:var(--gold); color:#fff;}
  .btn.green{background:#2E7D4F; color:#fff;}
  .btn.big{width:100%; padding:17px 32px; font-size:17px;}

  /* Cards */
  .card{
    background:var(--card); border-radius:20px; padding:24px; border:1px solid var(--line);
    box-shadow:0 2px 12px rgba(11,18,32,.05); transition:all .3s cubic-bezier(.2,.8,.2,1); text-align:left;
  }
  .card.click{cursor:pointer;}
  .card.click:hover{transform:translateY(-4px) scale(1.01); box-shadow:0 18px 44px rgba(11,18,32,.12);}
  .card.center{text-align:center;}

  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; color:#8A6E14; background:var(--goldsoft);
    border:1px solid rgba(198,160,46,.27); border-radius:999px; padding:6px 14px;
  }
  .chip .dot{width:6px; height:6px; border-radius:99px; background:var(--gold);}

  /* Grids */
  .grid{display:grid; gap:12px; margin:40px auto 0;}
  .grid.cats{display:flex; flex-wrap:wrap; justify-content:center; max-width:820px;}
  .grid.cats > .card{flex:1 1 140px; max-width:154px;}
  .grid.worlds{grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px; max-width:880px;}
  .grid.powers{grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; max-width:760px;}
  .grid.shows{grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); max-width:760px; margin-top:38px;}
  .grid.creator{grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:18px; max-width:820px; margin-top:36px;}
  .stack{display:grid; gap:14px; margin:36px auto 0; max-width:640px;}

  /* Chrome */
  #chrome{position:absolute; top:0; left:0; right:0; z-index:60; display:flex; align-items:center;
    justify-content:space-between; padding:18px 22px; pointer-events:none; will-change:transform;}
  #backbtn{pointer-events:auto; font:inherit; font-size:14px; font-weight:600; border:none; cursor:pointer;
    background:rgba(11,18,32,.06); color:var(--ink); border-radius:999px; padding:8px 16px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
  #chrome.on-dark #backbtn{background:rgba(255,255,255,.12); color:#fff;}
  #logo{font-weight:700; font-size:17px; letter-spacing:-.02em; color:var(--ink);}
  #chrome.on-dark #logo{color:#fff;}
  #logo b{color:var(--gold); font-weight:700;}
  #spacer{width:74px;}
  #dots{display:none!important; position:absolute; bottom:16px; left:50%; transform:translateX(-50%); gap:6px; z-index:40;}
  #dots i{display:block; width:6px; height:6px; border-radius:99px; background:rgba(11,18,32,.14); transition:all .4s;}
  #dots.on-dark i{background:rgba(255,255,255,.25);}
  #dots i.now{width:20px; background:var(--gold);}

  /* Animations */
  @keyframes riseIn{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;}}
  @keyframes cinemaIn{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;}}
  @keyframes tileIn{from{opacity:0; transform:scale(.6);} to{opacity:1; transform:scale(1);}}
  @keyframes pulseGlow{0%,100%{transform:scale(1);} 50%{transform:scale(1.08);}}
  @keyframes threadGrow{from{transform:scaleY(0);} to{transform:scaleY(1);}}
  .rise{animation:riseIn .7s cubic-bezier(.2,.8,.2,1) both;}
  .cinema{animation:cinemaIn 1.1s cubic-bezier(.2,.8,.2,1) both;}
  .tile{animation:tileIn .55s cubic-bezier(.2,.8,.2,1) both;}
  .pulse{animation:pulseGlow 1.6s ease-in-out infinite;}
  .thread{transform-origin:top; animation:threadGrow 1.6s cubic-bezier(.2,.8,.2,1) both .4s;}
  @media (prefers-reduced-motion:reduce){.rise,.cinema,.tile,.pulse,.thread,.scenein,.livetoast,.fanvid .bar,.btn.gold,#ambient i{animation:none!important;} #scene{transition:none!important;}}

  /* Scene transitions */
  #scene{transition:opacity .24s ease, transform .24s ease, filter .24s ease;}
  #scene.leaving{opacity:0; transform:scale(1.03); filter:blur(3px);}
  .scenein{animation:sceneIn .5s cubic-bezier(.2,.8,.2,1);}
  @keyframes sceneIn{from{opacity:0; transform:scale(.985);} to{opacity:1; transform:none;}}

  /* Ambient life */
  #ambient{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  #ambient i{position:absolute; display:block; border-radius:50%;}
  @keyframes drifta{0%,100%{transform:translate(0,0);} 50%{transform:translate(42px,-30px);}}
  @keyframes driftb{0%,100%{transform:translate(0,0);} 50%{transform:translate(-48px,38px);}}

  /* Live activity toasts */
  .livetoast{position:absolute; top:62px; right:14px; z-index:30; background:rgba(255,255,255,.93); border:1px solid var(--line); box-shadow:0 6px 20px rgba(11,18,32,.1); border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:600; animation:toastLife 2.8s ease both; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
  .livetoast.dark{background:rgba(255,255,255,.12); color:#fff; border-color:rgba(255,255,255,.2); box-shadow:none;}
  @keyframes toastLife{0%{opacity:0; transform:translateY(-8px);} 12%{opacity:1; transform:none;} 80%{opacity:1;} 100%{opacity:0; transform:translateY(-6px);}}

  /* Fan videos */
  .fanvid{aspect-ratio:9/16; border-radius:14px; position:relative; overflow:hidden; box-shadow:0 8px 24px rgba(11,18,32,.15);}
  .fanvid .play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.4);}
  .fanvid .cap{position:absolute; left:8px; right:8px; bottom:11px; color:#fff; font-size:10.5px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.55); text-align:left;}
  .fanvid .bar{position:absolute; left:0; bottom:0; height:3px; background:var(--gold); animation:vidbar 4s linear infinite;}
  @keyframes vidbar{from{width:0;} to{width:100%;}}

  /* Gold breathes */
  .btn.gold{animation:goldbreathe 3s ease-in-out infinite;}
  @keyframes goldbreathe{0%,100%{box-shadow:0 2px 10px rgba(198,160,46,.25);} 50%{box-shadow:0 6px 26px rgba(198,160,46,.45);}}

  /* Dark scenes */
  .darkscene{background:var(--dark); display:flex; align-items:center; justify-content:center; text-align:center; padding:28px;}
  .worldscene{display:flex; align-items:center; justify-content:center; padding:24px;}
  .worldscene.entryscene{align-items:flex-start; padding-top:88px; padding-bottom:56px;}

  /* Mosaic */
  #mosaicgrid{display:grid; grid-template-columns:repeat(13,1fr); gap:6px; width:125%;
    transition:all 1.4s cubic-bezier(.2,.8,.2,1);}
  #mosaicgrid.zoom{width:62%; max-width:700px; opacity:.4; filter:blur(1px);}
  #mosaicgrid .mtile{aspect-ratio:1; border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-size:clamp(10px,1.6vw,18px);}

  /* Peek modal */
  #peek{position:fixed; inset:0; background:rgba(6,10,20,.55); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; padding-top:76px; overscroll-behavior:contain;}
  #peek .panel{background:#fff; border-radius:24px; max-width:440px; width:100%; max-height:calc(100vh - 100px); overflow-y:auto; overscroll-behavior:contain;
    box-shadow:0 30px 80px rgba(0,0,0,.3); text-align:left;}
  #peek .panel div[style*="color:var(--muted)"][style*="font-weight:600"],
  #peek .panel div[style*="color:#8A6E14"][style*="font-weight:600"],
  #peek .panel div[style*="color:rgba(255,255,255,.78)"][style*="font-weight:600"]{
    text-align:center;
  }

  .ai-row{display:flex; justify-content:space-between; align-items:center; padding:14px 0;
    border-bottom:1px solid var(--line); opacity:.15; transition:opacity .5s;}
  .ai-row.show{opacity:1;}
  .ai-row:last-of-type{border-bottom:none;}
  .ai-verdict{margin-top:18px; background:var(--canvas); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; transition:all .6s; opacity:.25;}
  .ai-verdict.show{background:var(--goldsoft); border-color:rgba(198,160,46,.33); opacity:1;}

  .typechip{font-size:12.5px; font-weight:600; padding:6px 14px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted);}
  .typechip.on{background:var(--ink); color:#fff; border-color:var(--ink);}

  .catpill{color:#fff; font-size:14.5px; font-weight:600; padding:9px 18px; border-radius:999px;
    border:1px solid rgba(255,255,255,.22);}
</style>
</head>
<body>
<div id="fallback" style="position:fixed; inset:0; background:#060A14; display:flex; align-items:center; justify-content:center; text-align:center; padding:32px; z-index:100;">
  <div>
    <div style="color:#fff; font-size:64px; font-weight:700; letter-spacing:-.04em;">EWE<span style="color:#C6A02E">y</span></div>
    <div style="color:rgba(255,255,255,.6); font-size:14px; letter-spacing:.14em; text-transform:uppercase; margin-top:10px; font-weight:500;">The Participation Layer for All IP</div>
    <div style="color:#fff; font-size:19px; font-weight:600; margin-top:44px; line-height:1.5; max-width:420px;">This is an interactive prototype.</div>
    <div style="color:rgba(255,255,255,.65); font-size:15px; margin-top:12px; line-height:1.6; max-width:420px;">To experience it, open this file in your web browser — on a phone, tap the attachment and choose Safari or Chrome. On a computer, download it and double&#8209;click.</div>
    <div style="color:rgba(255,255,255,.4); font-size:12.5px; margin-top:36px;">Takes about 3 minutes · Best with sound off, curiosity on</div>
  </div>
</div>
<div id="stage">
  <div id="ambient">
    <i style="width:420px; height:420px; left:-8%; top:-10%; background:radial-gradient(circle, rgba(198,160,46,.15), transparent 70%); animation:drifta 19s ease-in-out infinite"></i>
    <i style="width:360px; height:360px; right:-6%; top:22%; background:radial-gradient(circle, rgba(42,58,92,.11), transparent 70%); animation:driftb 23s ease-in-out infinite"></i>
    <i style="width:300px; height:300px; left:12%; bottom:-8%; background:radial-gradient(circle, rgba(198,160,46,.12), transparent 70%); animation:driftb 17s ease-in-out infinite"></i>
    <i style="width:260px; height:260px; right:18%; bottom:6%; background:radial-gradient(circle, rgba(42,58,92,.09), transparent 70%); animation:drifta 26s ease-in-out infinite"></i>
  </div>
  <div id="chrome" style="display:none">
    <button id="backbtn" onclick="goBack()">&larr; Back</button>
    <div id="logo">EWE<b>y</b></div>
    <div id="spacer"></div>
  </div>
  <div id="scene" class="scene"></div>
  <div id="dots" style="display:none"></div>
</div>

<script>
// ————— Data —————
var WORLDS = {
  gw:{name:"Genius Weed", genre:"Comedy", grad:"linear-gradient(135deg,#123B2A 0%,#2E7D4F 55%,#7FB069 100%)"},
  ul:{name:"Unleashed", genre:"Animated Comedy", grad:"linear-gradient(135deg,#7A2E12 0%,#D96C2C 55%,#F2B267 100%)"},
  lf:{name:"The Last Future", genre:"Sci-Fi Mystery", grad:"linear-gradient(135deg,#0D1033 0%,#3A2E8C 55%,#7C6CD9 100%)"}
};
var CATEGORIES = [["📺","Television Series"],["🎬","Film"],["📚","Books"],["🎵","Music"],["🏈","Sports"],
  ["🎙️","Podcasts"],["👗","Fashion"],["📰","Journalism"],["🎥","Documentaries"],["🎮","Games"],["🎭","Live Events"]];
var EXPERIENCES = [
  {title:"The Review That Gets You Banned", body:"Film the café review so unhinged you\u2019d be banned for life. Add the AI \u201Csecurity footage.\u201D The winning review premieres as the Official Fan Cold Open on the show\u2019s channels — and you star in it."},
  {title:"The Chalkboard War", body:"Write the chalkboard message that starts a war between the regulars. The best becomes the Official Chalkboard of the Week — posted by the show, credited to you."},
  {title:"Today\u2019s Special, But Legendary", body:"Invent the menu item — then use AI to film its full commercial. The winner premieres on the show\u2019s official channels as the featured fan spot."},
  {title:"The Open Mic Discovery", body:"Write a stand-up set for a café regular who has never existed. If it kills, your character headlines the Official Fan Universe — celebrated by the creators, with you first in line to perform them in official content."},
  {title:"The Prequel Nobody\u2019s Seen", body:"Write or film the story of a regular — before episode one, flashback with AI. Donick picks a winner to spotlight, published in the Official Fan Companion with your name, and featured in the Weekly Mash-Up."},
  {title:"The Regular We\u2019ve Never Met", body:"Invent a customer from somewhere the show\u2019s never been. Write their first scene or film their entrance. If they land, they join the Official Fan Universe roster — celebrated by the creators, credited to you."},
  {title:"The Mug That Breaks the Internet", body:"Design the mug so cursed or so perfect the café can\u2019t stop selling it. The winner becomes real merchandise with your name on the tag — and you get a cut of every sale."}
];
var CATPEEK = {
  "Film":["Win a set visit — watch the sequel being filmed.","Remake the trailer shot-for-shot with your crew — the best one plays at the premiere.","Film the missing scene from another character's perspective."],
  "Books":["Win a weekend where the book takes place — tour the real restaurants, shops, and beaches from the story.","Win a video call with the author — talk favorite characters and hear what's coming next.","Join the official fan extras compilation — credited, featured, and earning points every time it plays."],
  "Music":["Win lunch with your favorite artist — top fan creation gets a seat at the table.","Create a chorus with your favorite artist.","Remake their song in a completely different genre."],
  "Fashion":["Win a front-row seat at the next runway show — and meet the designer backstage.","Style a look inspired by your favorite world — selected looks join the official collection.","Design the limited-edition piece fans will wear next — the winning design is produced and credited."],
  "Sports":["Win game-day tickets — call the winning play from the broadcast booth.","You're the sideline reporter — interview the MVP.","Design the limited-edition fan jersey."],
  "Podcasts":["Win a call-in — join the hosts live on next week's episode.","Record the voicemail the hosts read on air.","Continue the conversation — respond to this week's episode with your best idea. The best make the official \u201CIdeas That Could Change the World\u201D compilation.","Win tickets to the live show — and a meet-and-greet with the hosts."],
  "Journalism":["Who's the unsung hero in your hometown? Tell their story — editors verify, and the best run nationally with your byline.","Submit the photo behind the headline — published shots get credited and earn points.","Win a day in the newsroom — pitch your story to real editors."],
  "Documentaries":["Tell us your theory — and why. The most compelling theories get featured in the official companion episode.","Ask the filmmakers — top-voted questions get answered on camera.","Who changed your life? Share your one-minute story — selected stories join the companion film, credited.","Win a seat at the premiere — and meet the filmmakers."],
  "Games":["Win early access — be one of the first players inside the next expansion.","Design a side quest — the winning quest ships in the next update, with your name in the credits.","Hide the easter egg every player will hunt for."],
  "Live Events":["Win front-row seats and backstage passes for the next stop on the tour.","Vote the encore setlist into existence — then watch it happen live.","Record your section's fan chant — the best one plays in the arena.","Design this tour's limited merch drop — the winning design sells at the venue, credited."]
};
var FILM_CATEGORIES = {
  "Participate":{
    items:["Shoot the scene that happened off camera — made with AI. The winning headlines the Official Fan Showcase, presented by the filmmakers.","Cut the one-minute sequel pitch. The best trailer screens at the official fan premiere event.","Cast yourself. Your audition is a brand-new character. The winner gets a background-extra slot on a future shoot — credited."]
  },
  "Join the Official Film League":{
    items:["Weekly Challenges","XP","Badges","Leaderboards","Story World MVP"]
  },
  "Possible Official Experiences & Recognition":{
    label:"⭐ Signature Experience",
    title:"Showcased by the Filmmakers. You On Set as a Credited Extra.",
    note:"Note: Film differs from other worlds — its experiences are built around tangible released titles.",
    items:["Your trailer screens at the official fan premiere event.","Background-extra slot on credit.","Premieres · filmmaker Q&As · VIP screenings."]
  }
};
var MOSAIC_ICONS = ["🎭","🎨","✍️","📷","🎬","🎤","😂","🎵","🐶","☕","🛸","📝"];
// Development shortcut: keep the opening "Enter EWEy" world sequence out of the route.
var SCENES = ["cold","worldtype","storyworld","entry","experience","create","mosaic","ai","continues","win","local","beyond","creator","end"];
var DARK = {cold:1, mosaic:1, end:1, entry:1};

// ————— State —————
var startOnWorlds = new URLSearchParams(window.location.search).get("start") === "worldtype";
var S = {i:startOnWorlds ? 1 : 0, prompt:EXPERIENCES[0], timers:[]};

// Chrome (the EWEy header bar) scrolls away with the page instead of staying pinned.
(function(){
  var sceneEl = document.getElementById("scene");
  var chromeEl = document.getElementById("chrome");
  sceneEl.addEventListener("scroll", function(){
    chromeEl.style.transform = "translateY(-" + sceneEl.scrollTop + "px)";
  }, {passive:true});
})();

function clearTimers(){ S.timers.forEach(clearTimeout); S.timers = []; }
function later(fn, ms){ S.timers.push(setTimeout(fn, ms)); }
function go(i){
  clearTimers();
  var t = Math.max(0, Math.min(i, SCENES.length-1));
  var el = document.getElementById("scene");
  if (t === S.i || !el){ S.i = t; render(); return; }
  S.i = t;
  el.classList.add("leaving");
  S.timers.push(setTimeout(function(){ el.classList.remove("leaving"); render(); }, 230));
}
var LIVE = ["🔔 Donick just announced next week\u2019s challenge","🎭 Maya D. just earned 250 points","🎟️ Priya just won premiere tickets","⭐ New featured pick in Unleashed","🎥 17,841,698 fan videos posted today","😂 Sabatini\u2019s cousin is trending again","❤️ Jayden\u2019s café review just hit 10K","💰 Weekly cash challenge is live","🐶 A golden retriever just went viral","🏆 Weekly winners announced in 2 hours","🛍️ A fan mug design just became official merch","✨ Sofia\u2019s design advanced to review","📍 Pop-up café announced in Austin"];
function startLive(el, n, dark){
  n = n || 0;
  later(function(){
    var t = document.createElement("div");
    t.className = "livetoast" + (dark ? " dark" : "");
    t.textContent = LIVE[n % LIVE.length];
    el.appendChild(t);
    later(function(){ if (t.parentNode) t.remove(); }, 2900);
    startLive(el, n + 1, dark);
  }, n === 0 ? 700 : 3100);
}
function next(){ go(S.i+1); }
function goBack(){ go(S.i-1); }
function pickPrompt(idx){ S.prompt = EXPERIENCES[idx]; next(); }
function restart(){ S.prompt = EXPERIENCES[0]; go(0); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

// ————— Chrome —————
function renderChrome(){
  var id = SCENES[S.i];
  var chrome = document.getElementById("chrome");
  var dots = document.getElementById("dots");
  if (id === "cold"){ chrome.style.display = "none"; dots.style.display = "none"; return; }
  chrome.style.display = "flex";
  chrome.className = DARK[id] ? "on-dark" : "";
  document.getElementById("backbtn").style.visibility = id === "worldtype" ? "hidden" : "visible";
  if (id === "end"){ dots.style.display = "none"; }
  else {
    dots.style.display = "flex";
    dots.className = DARK[id] ? "on-dark" : "";
    var h = "";
    for (var k = 1; k < SCENES.length-1; k++) h += '<i class="' + (k === S.i ? "now" : "") + '"></i>';
    dots.innerHTML = h;
  }
}

// ————— Scene templates —————
function scCold(){
  var el = document.getElementById("scene");
  el.className = "scene darkscene";
  var lines = ["What if you could officially participate around your favorite story world?","Not rewrite it.","Create, perform, and play alongside it."];
  function showLine(n){
    if (n < lines.length){
      el.innerHTML = '<div class="cinema" style="color:#fff; font-size:clamp(26px,5vw,44px); font-weight:600; letter-spacing:-.02em; max-width:640px; line-height:1.25">' + lines[n] + '</div>';
      later(function(){ showLine(n+1); }, n === 0 ? 3500 : 2600);
    } else {
      el.innerHTML =
        '<div class="cinema">' +

    return '<div class="card rise" style="animation-delay:' + (i*140) + 'ms; display:flex; gap:14px; align-items:flex-start; padding:18px 20px">' +
      '<div style="font-size:24px; line-height:1">' + h[0] + '</div>' +
      '<div><div style="font-weight:700; font-size:15.5px; letter-spacing:-.02em">' + h[1] + '</div>' +
      '<div style="font-size:13px; color:var(--muted); line-height:1.5; margin-top:3px">' + h[2] + '</div></div></div>';
  }).join("");
  document.getElementById("localout").innerHTML =
    '<div style="margin-top:22px; text-align:left">' +
      '<div class="rise" style="font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:12px; text-align:center">Near ' + esc(z) + ' this week</div>' +
      '<div style="display:grid; gap:12px">' + cards + '</div>' +
      '<div class="rise" style="animation-delay:500ms; margin-top:16px; background:var(--goldsoft); border:1px solid rgba(198,160,46,.27); border-radius:14px; padding:14px 16px; font-size:13.5px; line-height:1.5; color:#8A6E14; font-weight:600; text-align:center">🎟️ Local winners this week take home premiere tickets + cash prizes</div>' +
      '<div class="rise" style="animation-delay:580ms; margin-top:12px; font-size:12.5px; color:var(--muted); text-align:center">Restaurants · Venues · Festivals · Museums · Bookstores — every world can show up in yours.</div>' +
      '<div class="rise" style="animation-delay:650ms; margin-top:22px"><button class="btn big" onclick="next()">Beyond the story</button></div>' +
    '</div>';
  document.getElementById("localskip").style.display = "none";
  document.getElementById("zipin").blur();
}

function scEnd(){
  var el = document.getElementById("scene");
  el.className = "scene darkscene";
  el.innerHTML = '<div class="cinema" style="color:#fff; font-size:clamp(24px,4.6vw,38px); font-weight:600; letter-spacing:-.02em; max-width:560px; line-height:1.3">Today you experienced one story world.</div>';
  later(function(){
    var pills = CATEGORIES.map(function(c, i){
      return '<span class="catpill tile" style="animation-delay:' + (i*120) + 'ms">' + c[0] + ' ' + c[1] + '</span>';
    }).join("");
    el.innerHTML = '<div class="cinema" style="max-width:680px">' +
      '<div style="color:rgba(255,255,255,.6); font-size:15px; letter-spacing:.12em; text-transform:uppercase; font-weight:500; margin-bottom:24px">Now imagine it for</div>' +
      '<div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center">' + pills + '</div>' +
    '</div>';
  }, 2100);
  later(scEndNetwork, 4600);
}

function scEndNetwork(){
  var el = document.getElementById("scene");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = el.clientWidth || window.innerWidth, H = el.clientHeight || window.innerHeight;
  var cx = W/2, cy = H/2, R = Math.min(W, H) * 0.30;
  var N = 150, pts = [], parts = "";
  for (var i = 0; i < N; i++){
    var a = Math.random() * Math.PI * 2;
    var r = R * Math.sqrt(Math.random());
    pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]);
    var sx = Math.random() * W, sy = Math.random() * H;
    parts += '<span class="npart" style="position:absolute; left:' + sx.toFixed(0) + 'px; top:' + sy.toFixed(0) + 'px; font-size:' + (10 + Math.random()*7).toFixed(0) + 'px; opacity:0; transform:translate(-50%,-50%); transition:left 2.2s cubic-bezier(.2,.8,.2,1) ' + (Math.random()*800).toFixed(0) + 'ms, top 2.2s cubic-bezier(.2,.8,.2,1) ' + (Math.random()*800).toFixed(0) + 'ms, opacity 1s">' + MOSAIC_ICONS[i % MOSAIC_ICONS.length] + '</span>';
  }
  var lines = "";
  for (var j = 0; j < 220 && lines.split("<line").length < 65; j++){
    var p1 = pts[Math.floor(Math.random()*N)], p2 = pts[Math.floor(Math.random()*N)];
    var d = Math.hypot(p1[0]-p2[0], p1[1]-p2[1]);
    if (d > 12 && d < R*0.55){
      lines += '<line x1="' + p1[0].toFixed(0) + '" y1="' + p1[1].toFixed(0) + '" x2="' + p2[0].toFixed(0) + '" y2="' + p2[1].toFixed(0) + '" stroke="rgba(198,160,46,.3)" stroke-width="1"/>';
    }
  }
  var ringR = Math.min(R * 1.5, Math.min(cx, cy) - 44);
  var eco = "", spokes = "";
  for (var e = 0; e < CATEGORIES.length; e++){
    var ea = -Math.PI/2 + e * (Math.PI*2 / CATEGORIES.length);
    var ex = cx + Math.cos(ea) * ringR, ey = cy + Math.sin(ea) * ringR;
    eco += '<span class="econode" style="position:absolute; left:' + ex.toFixed(0) + 'px; top:' + ey.toFixed(0) + 'px; transform:translate(-50%,-50%); white-space:nowrap; font-size:11.5px; font-weight:600; color:#fff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:5px 11px; opacity:0; transition:opacity .8s ' + (e*100) + 'ms">' + CATEGORIES[e][0] + ' ' + CATEGORIES[e][1] + '</span>';
    spokes += '<line x1="' + (cx + Math.cos(ea)*R*0.85).toFixed(0) + '" y1="' + (cy + Math.sin(ea)*R*0.85).toFixed(0) + '" x2="' + ex.toFixed(0) + '" y2="' + ey.toFixed(0) + '" stroke="rgba(198,160,46,.28)" stroke-width="1"/>';
  }
  el.innerHTML =
    '<div id="net" style="position:absolute; inset:0; overflow:hidden; transition:opacity 1.2s, filter 1.2s">' +
      '<div id="netglow" style="position:absolute; left:50%; top:50%; width:' + (R*2.7).toFixed(0) + 'px; height:' + (R*2.7).toFixed(0) + 'px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(198,160,46,.3), transparent 65%); opacity:0; transition:opacity 1.6s"></div>' +
      '<svg id="netlines" width="' + W + '" height="' + H + '" style="position:absolute; inset:0; opacity:0; transition:opacity 1.4s">' + lines + '</svg>' +
      '<svg id="ecolines" width="' + W + '" height="' + H + '" style="position:absolute; inset:0; opacity:0; transition:opacity 1.2s">' + spokes + '</svg>' +
      parts + eco +
    '</div>' +
    '<div id="networds" style="position:relative; z-index:2; text-align:center; padding:24px">' +
      '<div id="nw1" style="color:#fff; font-size:clamp(22px,4.2vw,34px); font-weight:600; letter-spacing:-.02em; line-height:1.3; opacity:0; transition:opacity 1.1s, transform 1.1s; transform:translateY(14px)">Every story becomes a community.</div>' +
      '<div id="nw2" style="color:#fff; font-size:clamp(22px,4.2vw,34px); font-weight:600; letter-spacing:-.02em; line-height:1.3; margin-top:8px; opacity:0; transition:opacity 1.1s, transform 1.1s; transform:translateY(14px)">Every fan becomes a creator.</div>' +
      '<div id="nw2b" style="color:var(--gold); font-size:clamp(22px,4.2vw,34px); font-weight:600; letter-spacing:-.02em; line-height:1.3; margin-top:8px; opacity:0; transition:opacity 1.1s, transform 1.1s; transform:translateY(14px)">Every creator builds a world.</div>' +
      '<div id="nw3" style="opacity:0; transition:opacity 1.4s">' +
        '<div style="color:#fff; font-size:clamp(44px,8vw,68px); font-weight:700; letter-spacing:-.04em; margin-top:38px">EWE<span style="color:var(--gold)">y</span></div>' +
        '<div style="color:rgba(255,255,255,.6); font-size:13px; letter-spacing:.14em; text-transform:uppercase; font-weight:500; margin-top:12px">The Participation Layer for All IP</div>' +
        '<div style="color:rgba(255,255,255,.4); font-size:12.5px; margin-top:8px">Everyone Wins. Especially You.</div>' +
      '</div>' +
      '<div id="nw4" style="opacity:0; transition:opacity 1.2s; margin-top:34px"><button class="btn white" onclick="restart()">Experience it again</button></div>' +
    '</div>';
  function converge(){
    var els = el.querySelectorAll(".npart");
    for (var k = 0; k < els.length; k++){
      els[k].style.left = pts[k][0].toFixed(0) + "px";
      els[k].style.top = pts[k][1].toFixed(0) + "px";
      els[k].style.opacity = ".9";
    }
  }
  function weave(){
    document.getElementById("netlines").style.opacity = "1";
    document.getElementById("netglow").style.opacity = "1";
  }
  function eco_in(){
    document.getElementById("ecolines").style.opacity = "1";
    var ns = el.querySelectorAll(".econode");
    for (var q = 0; q < ns.length; q++) ns[q].style.opacity = "1";
  }
  function dim(){
    var n = document.getElementById("net");
    n.style.opacity = ".28"; n.style.filter = "blur(1px)";
  }
  function word(id){
    var w = document.getElementById(id);
    w.style.opacity = "1"; w.style.transform = "none";
  }
  if (reduce){
    converge(); weave(); eco_in(); dim(); word("nw1"); word("nw2"); word("nw2b"); word("nw3"); word("nw4");
    var all = el.querySelectorAll(".npart, .econode, #netlines, #ecolines, #netglow, #net, #nw1, #nw2, #nw2b, #nw3, #nw4");
    for (var m = 0; m < all.length; m++) all[m].style.transition = "none";
    return;
  }
  later(function(){ requestAnimationFrame(converge); }, 60);
  later(weave, 2300);
  later(eco_in, 3500);
  later(function(){ dim(); word("nw1"); }, 5400);
  later(function(){ word("nw2"); }, 6600);
  later(function(){ word("nw2b"); }, 7800);
  later(function(){ word("nw3"); }, 9400);
  later(function(){ word("nw4"); }, 10800);
}

// ————— Router —————
function render(){
  var el = document.getElementById("scene");
  el.style.background = "";
  el.scrollTop = 0;
  document.getElementById("chrome").style.transform = "translateY(0)";
  var id = SCENES[S.i];
  renderChrome();
  if (id === "cold") scCold();
  else if (id === "worldtype") scWorldType();
  else if (id === "storyworld") scStoryWorld();
  else if (id === "entry") scEntry();
  else if (id === "experience") scExperience();
  else if (id === "create") scCreate();
  else if (id === "mosaic") scMosaic();
  else if (id === "ai") scAI();
  else if (id === "continues") scContinues();
  else if (id === "win") scWin();
  else if (id === "local") scLocal();
  else if (id === "beyond") scBeyond();
  else if (id === "creator") scCreator();
  else if (id === "end") scEnd();
  el.classList.remove("scenein"); void el.offsetWidth; el.classList.add("scenein");
}
var OFFICIAL_STATEMENT = "Official participation alongside the canon. Never rewriting it. Always celebrating it.";
function centerOfficialStatements(root){
  if (!root || root.nodeType !== 1) return;
  var nodes = [];
  if (root.matches && root.matches("div")) nodes.push(root);
  if (root.querySelectorAll) nodes = nodes.concat(Array.prototype.slice.call(root.querySelectorAll("div")));
  nodes.forEach(function(node){
    if (node.textContent.trim() === OFFICIAL_STATEMENT) node.style.textAlign = "center";
  });
}
var officialStatementObserver = new MutationObserver(function(mutations){
  mutations.forEach(function(mutation){
    Array.prototype.forEach.call(mutation.addedNodes, centerOfficialStatements);
  });
});
officialStatementObserver.observe(document.body, {childList:true, subtree:true});
centerOfficialStatements(document.body);
var fb = document.getElementById("fallback");
if (fb) fb.remove();
render();
</script>
